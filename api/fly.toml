# Fly.io app config for the DreamAbroad CRM API.
# See https://fly.io/docs/reference/configuration/ for the full reference.
#
# Rename `app` below if "dreamabroad-api" is already taken (Fly app names are
# global). After first `fly launch --copy-config`, Fly will offer to rename.

app = "dreamabroad-api"
primary_region = "sin"   # Singapore — closest to Bangkok / LINE servers in Asia

[build]
  dockerfile = "Dockerfile.prod"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # auto_stop_machines = "off" keeps the API always-on so LINE webhooks always
  # find a live server. Auto-stop saves money on idle but causes cold-start
  # webhook drops, which is unacceptable for an event-driven CRM.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Healthcheck — Fly hits this to verify the container is healthy and decide
  # whether to route traffic / restart. We use the existing /api/stages GET
  # rather than adding a dedicated /healthz: it's cheap, public (no auth),
  # exercises the DB connection, and returns JSON we can sanity-check.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/stages"

[[vm]]
  # shared-cpu-1x with 256MB is in the free allowance. The NestJS process
  # boots in ~200MB; if we hit limits later, bump to 512MB ($).
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
